spring.application.name=crudPRODUCTO

# Puerto dinámico (usa el que asigne la nube o 8080 por defecto en local)
server.port=${PORT:8080}

# Configuración de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:productosdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate recrea las tablas limpias al arrancar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2 (opcional, útil para revisar tus datos en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
